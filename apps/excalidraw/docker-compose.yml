services:
  excalidraw:
    image: excalidraw/excalidraw:latest
    container_name: excalidraw
    restart: unless-stopped
    networks:
      - default

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: oauth2-proxy-excalidraw
    restart: unless-stopped
    depends_on:
      - excalidraw
    ports:
      - "6100:4180"
    env_file:
      - .env
    networks:
      - default

networks:
  default:
    name: excalidraw-net
